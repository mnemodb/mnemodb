<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MnemoDB - Docs</title>
<meta name="description" content="MnemoDB documentation: usage guide, format specification, roadmap, and changelog." />
<link rel="canonical" href="https://mnemodb.dev/reference.html" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232dd4bf'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='800' text-anchor='middle' fill='%2304211e'%3EM%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0b0e14; --bg2:#0f131c; --card:#141a26;
    --line:#232c3d; --line2:#2c374b;
    --fg:#e6ebf5; --muted:#93a1bd; --dim:#66738c;
    --accent:#2dd4bf; --accent2:#5eead4; --accent-dim:#0f3b38;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.65;
    -webkit-font-smoothing:antialiased;font-size:16px}
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}
  code{font-family:var(--mono)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  nav{position:sticky;top:0;z-index:20;background:rgba(11,14,20,.85);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--fg)}
  .brand:hover{text-decoration:none}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#3b82f6);
    display:grid;place-items:center;font-family:var(--mono);font-weight:800;color:#04211e;font-size:15px}
  .navlinks{display:flex;gap:24px;align-items:center;font-size:14.5px}
  .navlinks a{color:var(--muted)}
  .navlinks a:hover{color:var(--fg);text-decoration:none}

  .layout{display:grid;grid-template-columns:230px 1fr;gap:44px;padding:36px 0 90px;align-items:start}
  @media(max-width:820px){.layout{grid-template-columns:1fr;gap:8px}}

  aside{position:sticky;top:84px}
  @media(max-width:820px){aside{position:static;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}}
  .sidet{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--dim);margin:0 0 12px;padding-left:12px}
  .side a{display:block;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:15px;margin-bottom:2px}
  .side a:hover{background:var(--card);color:var(--fg);text-decoration:none}
  .side a.active{background:var(--accent-dim);color:var(--accent2);font-weight:600}
  @media(max-width:820px){aside .side{display:flex;flex-wrap:wrap;gap:6px}.side a{margin:0}}

  .content{min-width:0}
  .loading,.error{color:var(--dim);font-family:var(--mono);font-size:14px;padding:40px 0}
  .error a{color:var(--accent2)}
  .srcbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
  .srcbar .title{font-size:14px;color:var(--muted)}
  .srcbar a{font-family:var(--mono);font-size:12.5px;color:var(--dim)}

  /* rendered markdown */
  .prose{max-width:780px}
  .prose h1{font-size:32px;letter-spacing:-.015em;margin:.2em 0 .5em;font-weight:800;line-height:1.15}
  .prose h2{font-size:24px;letter-spacing:-.01em;margin:1.6em 0 .5em;padding-top:.4em;
    border-top:1px solid var(--line);font-weight:700}
  .prose h3{font-size:19px;margin:1.4em 0 .4em;font-weight:650}
  .prose h4{font-size:16px;margin:1.2em 0 .3em;color:var(--muted);font-weight:650}
  .prose p{color:#cdd6e6;margin:.9em 0}
  .prose ul,.prose ol{color:#cdd6e6;padding-left:1.4em;margin:.9em 0}
  .prose li{margin:.35em 0}
  .prose li::marker{color:var(--dim)}
  .prose a{color:var(--accent2);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--accent-dim)}
  .prose strong{color:var(--fg)}
  .prose em{color:#cdd6e6}
  .prose code{font-size:.88em;background:var(--card);border:1px solid var(--line);border-radius:5px;
    padding:.12em .4em;color:var(--accent2)}
  .prose pre{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    overflow-x:auto;margin:1.1em 0;line-height:1.62}
  .prose pre code{background:none;border:0;padding:0;color:#c8d3e6;font-size:13.5px}
  .prose blockquote{border-left:3px solid var(--accent);background:var(--card);
    border-radius:0 8px 8px 0;margin:1.1em 0;padding:2px 18px;color:var(--muted)}
  .prose hr{border:0;border-top:1px solid var(--line);margin:2em 0}
  .prose table{border-collapse:collapse;width:100%;margin:1.1em 0;font-size:14.5px;display:block;overflow-x:auto}
  .prose th,.prose td{border:1px solid var(--line);padding:8px 12px;text-align:left}
  .prose th{background:var(--card);color:var(--fg);font-weight:600}
  .prose td{color:#cdd6e6}
  .prose img{max-width:100%}
  .prose h1 a,.prose h2 a,.prose h3 a{color:inherit;text-decoration:none}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="index.html"><span class="logo">M</span> MnemoDB</a>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="#" id="topdoc">Docs</a>
      <a href="https://github.com/mnemodb/mnemodb">GitHub</a>
      <a href="https://www.npmjs.com/package/mnemodb">npm</a>
    </div>
  </div>
</nav>

<div class="wrap layout">
  <aside>
    <p class="sidet">Documentation</p>
    <nav class="side" id="side"></nav>
  </aside>
  <main class="content">
    <div class="srcbar">
      <span class="title" id="doctitle">Loading…</span>
      <a id="srclink" href="https://github.com/mnemodb/mnemodb" target="_blank" rel="noopener">view source on GitHub ↗</a>
    </div>
    <article class="prose" id="prose"><div class="loading">Loading documentation…</div></article>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
  var REPO = "mnemodb/mnemodb", BRANCH = "main";
  var RAW = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/";
  var GH  = "https://github.com/" + REPO + "/blob/" + BRANCH + "/";
  var DOCS = [
    { id:"overview",  title:"Overview",       path:"README.md" },
    { id:"usage",     title:"Usage guide",    path:"docs/USAGE.md" },
    { id:"spec",      title:"Specification",  path:"spec/SPEC-v0.1.md" },
    { id:"roadmap",   title:"Roadmap",        path:"ROADMAP.md" },
    { id:"changelog", title:"Changelog",      path:"CHANGELOG.md" }
  ];
  var DEFAULT = "usage";

  function param(){ try { return new URLSearchParams(location.search).get("doc"); } catch(e){ return null; } }
  function docById(id){ for (var i=0;i<DOCS.length;i++) if (DOCS[i].id===id) return DOCS[i]; return null; }

  function buildSide(active){
    var s = document.getElementById("side"); s.innerHTML = "";
    DOCS.forEach(function(d){
      var a = document.createElement("a");
      a.href = "reference.html?doc=" + d.id;
      a.textContent = d.title;
      if (d.id === active) a.className = "active";
      a.addEventListener("click", function(e){ e.preventDefault(); load(d.id, true); });
      s.appendChild(a);
    });
    var top = document.getElementById("topdoc");
    if (top) top.href = "reference.html?doc=" + active;
  }

  function load(id, push){
    var d = docById(id) || docById(DEFAULT);
    buildSide(d.id);
    document.getElementById("doctitle").textContent = d.title;
    document.getElementById("srclink").href = GH + d.path;
    var prose = document.getElementById("prose");
    prose.innerHTML = '<div class="loading">Loading ' + d.title + '…</div>';
    if (push) history.pushState({ id:d.id }, "", "reference.html?doc=" + d.id);
    document.title = "MnemoDB - " + d.title;

    fetch(RAW + d.path, { cache:"no-cache" })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(md){
        md = md.replace(/—/g, "-");   // em-dashes -> hyphens (site style; source docs untouched)
        marked.setOptions({ gfm:true, breaks:false, headerIds:true, mangle:false });
        prose.innerHTML = marked.parse(md);
        window.scrollTo(0,0);
      })
      .catch(function(err){
        prose.innerHTML = '<div class="error">Could not load this document ('+err.message+').<br>' +
          'Read it directly on <a href="'+GH+d.path+'" target="_blank" rel="noopener">GitHub ↗</a>.</div>';
      });
  }

  window.addEventListener("popstate", function(){ load(param() || DEFAULT, false); });
  load(param() || DEFAULT, false);
</script>
</body>
</html>
