name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Delegate to package.json rather than restating the globs: this line
      # drifted once already when plugin/test/ moved to test/, and Node 20 fails
      # hard on a pattern that matches nothing while Node 22 quietly passes.
      - run: npm test
      - name: Security gate (adversarial suite must pass)
        run: node --test packages/mcp/test/security.test.js
