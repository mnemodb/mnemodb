name: Release
# Publishes all four packages to npm with sigstore provenance when a version
# tag is pushed (e.g. `git tag v0.1.10 && git push --tags`).
#
# Setup required once (audit M9):
#   - Either add a granular npm automation token as the repo secret NPM_TOKEN,
#     OR configure npm "trusted publishing" (OIDC) for each package on npmjs.com
#     and remove the NODE_AUTH_TOKEN lines below.
#   - Provenance needs npm >= 9.5 (bundled with Node 20+) and id-token: write.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for npm provenance (sigstore attestation)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test packages/core/test/*.test.js packages/mcp/test/*.test.js plugin/test/*.test.js
      - name: Security gate (adversarial suite must pass before publish)
        run: node --test packages/mcp/test/security.test.js
      # Publish in dependency order: core first, meta package last.
      - name: Publish @mnemodb/core
        run: npm publish -w packages/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @mnemodb/cli
        run: npm publish -w packages/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @mnemodb/mcp
        run: npm publish -w packages/mcp --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish mnemodb
        run: npm publish -w packages/mnemodb --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
